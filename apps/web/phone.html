<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <title>FireFIT sensor</title>
    <link rel="stylesheet" href="/src/phone/phone.css" />
  </head>
  <body>
    <video id="cam" playsinline muted></video>
    <canvas id="out"></canvas>

    <div id="hud" hidden>
      <div id="reps">0</div>
      <div id="stage">—</div>
      <div id="cue"></div>
    </div>

    <div id="bar">
      <span id="status">FireFIT sensor</span>
      <span id="debug"></span>
    </div>

    <button id="swap" hidden aria-label="Switch camera"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/><path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"/><circle cx="12" cy="12" r="3"/><path d="m18 22-3-3 3-3"/><path d="m6 2 3 3-3 3"/></svg></button>

    <div id="tools" hidden>
      <button id="ex-squat" class="on">Squat</button>
      <button id="ex-pushup">Push-up</button>
      <button id="ex-plank">Plank</button>
      <button id="reset">Reset</button>
    </div>

    <div id="rotate">
      <div class="phone-icon"></div>
      <h2>Turn your phone sideways</h2>
      <p>FireFIT needs landscape so your whole body fits in the frame.</p>
    </div>

    <div id="start">
      <div class="start-info">
        <img class="logo" src="/img/logo.png" alt="FireFIT" />
        <ol class="steps">
          <li>Prop the phone up sideways, 2.5–3 m away</li>
          <li>Step back until your whole body is in frame</li>
          <li>Tap Start, then follow the TV</li>
        </ol>
      </div>
      <div class="start-go">
        <div class="cam-pick" role="group" aria-label="Camera">
          <button id="cam-user" class="on">Front camera</button>
          <button id="cam-environment">Back camera</button>
        </div>
        <button id="go">Start</button>
        <p id="start-msg"></p>
      </div>
    </div>

    <script type="module" src="/src/phone/main.ts"></script>
  </body>
</html>
