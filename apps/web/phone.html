<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <title>FireFIT sensor</title>
    <link rel="stylesheet" href="/src/phone/phone.css" />
  </head>
  <body>
    <video id="cam" playsinline muted></video>
    <canvas id="out"></canvas>

    <div id="hud" hidden>
      <div id="reps">0</div>
      <div id="stage">—</div>
      <div id="cue"></div>
    </div>

    <div id="bar">
      <span id="status">FireFIT sensor</span>
      <span id="debug"></span>
    </div>

    <div id="tools" hidden>
      <button id="ex-squat" class="on">Squat</button>
      <button id="ex-pushup">Push-up</button>
      <button id="ex-plank">Plank</button>
      <button id="reset">Reset</button>
    </div>

    <div id="start">
      <h1>fire<span>fit</span></h1>
      <p id="start-msg">Prop the phone up in landscape, 2.5–3 m away, with your whole body in frame.</p>
      <button id="go">Tap to start camera</button>
    </div>

    <script type="module" src="/src/phone/main.ts"></script>
  </body>
</html>
