name: Release APK

# Push a tag like v1.0.0 to build the Fire TV shell and attach firefit.apk to a GitHub release.
# The asset name never changes, so https://github.com/jimmieldavisjr/firefit-tv/releases/latest/download/firefit.apk
# always serves the newest build.
# Set the repository variable FIREFIT_URL to the production CloudFront tv.html URL first.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build APK pointing at production
        working-directory: apps/tv-shell
        env:
          KEYSTORE_B64: ${{ secrets.FIREFIT_KEYSTORE_B64 }}
          FIREFIT_KEYSTORE_PASSWORD: ${{ secrets.FIREFIT_KEYSTORE_PASSWORD }}
        run: |
          test -n "${{ vars.FIREFIT_URL }}" || { echo "Set the FIREFIT_URL repository variable"; exit 1; }
          # Sign with the permanent key so this release updates the previous one in place
          test -n "$KEYSTORE_B64" || { echo "Set the FIREFIT_KEYSTORE_B64 / FIREFIT_KEYSTORE_PASSWORD secrets"; exit 1; }
          export FIREFIT_KEYSTORE="$RUNNER_TEMP/firefit-release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$FIREFIT_KEYSTORE"
          ./gradlew assembleDebug -PfirefitUrl="${{ vars.FIREFIT_URL }}"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/firefit.apk"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" firefit.apk --title "FireFIT ${{ github.ref_name }}" --generate-notes
